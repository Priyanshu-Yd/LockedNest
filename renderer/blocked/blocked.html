<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Blocked — SafeNest</title>
    <style>
      :root {
        --bg: #0a0c10;
        --card: rgba(18, 21, 28, 0.92);
        --line: rgba(235, 230, 220, 0.12);
        --text: #ebe6dc;
        --muted: #8b8790;
        --accent: #5eb8a8;
        --font: "DM Sans", "Segoe UI", sans-serif;
        --display: "Syne", "Segoe UI Variable", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(900px 400px at 50% 20%, rgba(94, 184, 168, 0.1), transparent 55%),
          var(--bg);
        padding: 24px;
      }
      .card {
        width: min(440px, 100%);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--card);
        padding: 36px 28px;
        text-align: center;
      }
      .mark {
        width: 14px;
        height: 14px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 5px rgba(94, 184, 168, 0.14);
      }
      h1 {
        margin: 0 0 10px;
        font-family: var(--display);
        font-size: 1.45rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .hint {
        margin-top: 18px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true"></div>
      <h1 id="title">Website Blocked</h1>
      <p id="message">This domain is not allowed in your Nest.</p>
      <p class="hint" id="hint">Manage allowed websites from Settings.</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const reason = params.get('reason') || 'blocked';
      if (reason === 'removed') {
        document.getElementById('title').textContent = 'Website Access Removed';
        document.getElementById('message').textContent =
          'This domain is no longer allowed in your Nest.';
        document.getElementById('hint').textContent = 'Return to Home to continue.';
      }
    </script>
  </body>
</html>
